openapi: 3.2.0
info:
  title: Gender Types API
  description: For managing custom gender types. E&OE.
  version: '1.0'
tags:
- name: Gender Types
paths:
  /gendertypes:
    get:
      description: Returns a list of custom gender types.
      tags:
      - Gender Types
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedGenderTypes'
      summary: Get gendertypes
      x-summary-source: derived
      operationId: getGendertypes
      x-operation-id-source: derived
    post:
      description: Create a new custom gender type.
      tags:
      - Gender Types
      requestBody:
        $ref: '#/components/requestBodies/CreateGenderType'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenderType'
      summary: Create gendertypes
      x-summary-source: derived
      operationId: postGendertypes
      x-operation-id-source: derived
  /gendertypes/{genderTypeName}:
    get:
      description: Returns a single custom gender type.
      tags:
      - Gender Types
      parameters:
      - name: genderTypeName
        in: path
        description: Name of the custom gender type.
        required: true
        schema:
          type: string
        example: Transgender
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenderType'
      summary: Get gendertypes by gender type name
      x-summary-source: derived
      operationId: getGendertypesByGenderTypeName
      x-operation-id-source: derived
    put:
      description: Update a single custom gender type.
      tags:
      - Gender Types
      parameters:
      - name: genderTypeName
        in: path
        description: Name of the custom gender type.
        required: true
        schema:
          type: string
        example: Transgender
      requestBody:
        $ref: '#/components/requestBodies/UpdateGenderType'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenderType'
      summary: Replace gendertypes by gender type name
      x-summary-source: derived
      operationId: putGendertypesByGenderTypeName
      x-operation-id-source: derived
    delete:
      description: Delete a custom gender type. Please note - you cannot delete a custom gender type if it is already assigned to an existing participant record.
      tags:
      - Gender Types
      parameters:
      - name: genderTypeName
        in: path
        description: Name of the custom gender type.
        required: true
        schema:
          type: string
        example: Transgender
      responses:
        '204':
          description: Success, No content.
      summary: Delete gendertypes by gender type name
      x-summary-source: derived
      operationId: deleteGendertypesByGenderTypeName
      x-operation-id-source: derived
components:
  schemas:
    UpdateGenderType:
      type: object
      required:
      - pronounType
      properties:
        pronounType:
          description: One of 'Male', 'Female', 'Neutral', or 'Company'.
          enum:
          - Male
          - Female
          - Neutral
          - Company
          example: Neutral
          type: string
    PagingData:
      type: object
      properties:
        gendertypes:
          $ref: '#/components/schemas/GenderTypesPageData'
    GenderType:
      type: object
      properties:
        genderTypeName:
          description: Name of the custom gender type.
          example: Transgender
          type: string
        pronounType:
          description: One of 'Male', 'Female', 'Neutral', or 'Company'.
          enum:
          - Male
          - Female
          - Neutral
          - Company
          example: Neutral
          type: string
    PageMetaData:
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/PagingData'
    PagedGenderTypes:
      type: object
      properties:
        gendertypes:
          type: array
          items:
            $ref: '#/components/schemas/GenderType'
        meta:
          $ref: '#/components/schemas/PageMetaData'
    CreateGenderType:
      type: object
      required:
      - genderTypeName
      - pronounType
      properties:
        genderTypeName:
          description: Name of the custom gender type.
          example: Transgender
          type: string
        pronounType:
          description: One of 'Male', 'Female', 'Neutral', or 'Company'.
          enum:
          - Male
          - Female
          - Neutral
          - Company
          example: Neutral
          type: string
    GenderTypesPageData:
      type: object
      properties:
        recordCount:
          description: The total number of custom gender types returned by the underlying query.
          type: integer
          example: 4
        pageCount:
          description: The total number of pages generated by the underlying query.
          type: integer
          example: 8
        page:
          description: The page number for this page of custom gender types.
          type: integer
          example: 2
        pageSize:
          description: Page size.
          type: integer
          example: 50
        prevPage:
          description: A URL to the previous page of custom gender types.
          type: string
          example: https://ap-southeast-2.actionstep.com/api/rest/gendertypes?page=1
        nextPage:
          description: A URL to the next page of custom gender types.
          type: string
          example: https://ap-southeast-2.actionstep.com/api/rest/gendertypes?page=3
  requestBodies:
    CreateGenderType:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateGenderType'
    UpdateGenderType:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateGenderType'
